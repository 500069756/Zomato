<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zomato AI Recommendation</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="app-shell">
    <header>
      <h1>Zomato AI Restaurant Recommendations</h1>
      <p>Enter your preferences and get AI-ranked restaurant suggestions.</p>
    </header>

    <section class="form-section">
      <form id="recommendation-form">
        <div class="row">
          <label for="location">Location</label>
          <select id="location" name="location">
            <option value="">Select a location</option>
            <!-- Localities will be populated by JavaScript -->
          </select>
        </div>
        <div class="row">
          <label for="budget">Budget</label>
          <select id="budget" name="budget">
            <option value="">Any</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div class="row">
          <label for="cuisine">Cuisine</label>
          <input id="cuisine" name="cuisine" placeholder="e.g. Chinese" />
        </div>
        <div class="row">
          <label for="minimum_rating">Minimum Rating</label>
          <input id="minimum_rating" name="minimum_rating" type="number" step="0.1" min="0" max="5" value="4.0" />
        </div>
        <div class="row">
          <label for="additional_preferences">Additional Preferences</label>
          <input id="additional_preferences" name="additional_preferences" placeholder="e.g. family-friendly, quick service" />
        </div>
        <div class="row">
          <label for="top_n">Results</label>
          <input id="top_n" name="top_n" type="number" min="1" max="10" value="5" />
        </div>

        <button type="submit">Get Recommendations</button>
      </form>
    </section>

    <section class="status-section">
      <div id="status-message" class="status-message"></div>
      <div id="recommendation-summary" class="recommendation-summary"></div>
      <div id="recommendation-cards" class="recommendation-cards"></div>
    </section>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
